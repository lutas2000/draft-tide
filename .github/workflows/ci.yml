name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    # Core, Engine, CLI and MCP on every platform (M1 plan §13.4). Engine
    # tests run the companion from source; the macOS run also builds the
    # peer-identity addon and exercises instance pinning.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @draft-tide/contracts --filter @draft-tide/companion run build
      - run: pnpm run test

  desktop:
    name: Desktop build and GUI E2E (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @draft-tide/desktop run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/test-results/
